<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooms Flower Shop - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="products.html"><i class="fa-solid fa-spa"></i> Products</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
        <a href="orders.html"><i class="fa-solid fa-truck-ramp-box"></i> Track Order</a>
        <a href="login.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="contact.html" class="active"><i class="fa-solid fa-envelope"></i> Contact Us <i class="fa-solid fa-chevron-down nav-arrow"></i></a>
        <a href="about.html"><i class="fa-solid fa-circle-info"></i> About Us <i class="fa-solid fa-chevron-down nav-arrow"></i></a>
    </nav>

    <div class="container">
        <h1><i class="fa-solid fa-paper-plane"></i> Contact Us</h1>
        <p class="subtitle">Have questions or custom requests? Send us a message!</p>

        <div class="form-card">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name"><i class="fa-solid fa-user"></i> Your Name</label>
                    <input type="text" id="name" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-at"></i> Email Address</label>
                    <input type="email" id="email" required placeholder="jane@example.com">
                </div>
                <div class="form-group">
                    <label for="message"><i class="fa-solid fa-comment-dots"></i> Message</label>
                    <textarea id="message" maxlength="500" required placeholder="Inquire about custom bouquet sizes..."></textarea>
                    <small id="charCount" style="display: block; text-align: right; color: #777; margin-top: 4px;">0 / 500 characters</small>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin: 0;"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
                <div id="formFeedback" style="display: none; margin-top: 15px; padding: 10px; background: #e8f5e9; color: #2e7d32; border-radius: 6px; text-align: center;"></div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Blooms Flower Shop. All rights reserved.</p>
    </footer>

    <script>
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const contactForm = document.getElementById('contactForm');
        const formFeedback = document.getElementById('formFeedback');

        if (messageInput) {
            messageInput.addEventListener('input', () => {
                charCount.textContent = `${messageInput.value.length} / 500 characters`;
            });
        }

        if (contactForm) {
            contactForm.addEventListener('submit', (e) => {
                e.preventDefault();
                formFeedback.style.display = 'block';
                formFeedback.innerHTML = '<i class="fa-solid fa-circle-check"></i> Thank you! We have received your message and will get back to you shortly.';
                contactForm.reset();
                if (charCount) charCount.textContent = '0 / 500 characters';
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
